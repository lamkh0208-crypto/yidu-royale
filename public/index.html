<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#101418">
<title>已讀不回大逃殺</title>
<meta name="description" content="1–12 人的聊天室淘汰賽。被老闆、前任、親戚訊息轟炸，回得最爛的那句扣一條命。一個人也能玩。">
<meta property="og:title" content="已讀不回大逃殺">
<meta property="og:description" content="老闆、前任、親戚同時敲你。回得最爛的那句，扣一條命。">
<meta property="og:type" content="website">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="home" class="screen">
  <div class="home-card">
    <div class="logo" aria-hidden="true"><span class="tick">✓✓</span></div>
    <div class="seg" role="group" aria-label="地區版本">
      <button id="locTW" type="button">🇹🇼 台灣版</button>
      <button id="locHK" type="button">🇭🇰 香港版</button>
    </div>
    <h1 id="homeTitle">已讀不回<br>大逃殺</h1>
    <p id="homeTag" class="tag">老闆、前任、親戚同時敲你。<br>回得最爛的那句，扣一條命。</p>
    <label for="name">暱稱</label>
    <input id="name" maxlength="8" autocomplete="off" placeholder="最多 8 個字">
    <div id="joinBox">
      <label for="code">房間碼</label>
      <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="四個英文字母">
      <button id="btnJoin" class="primary">加入房間</button>
      <div class="or">或</div>
    </div>
    <button id="btnCreate" class="ghost">開一間新房間（揪朋友）</button>
    <button id="btnSolo" class="ghost">🤖 一個人玩（對戰 AI 路人）</button>
    <p class="notice">全部角色皆為虛構。請勿輸入真實姓名、電話等個資；回覆內容可能會送交 AI 服務評分。<a href="privacy.html">隱私與使用說明</a></p>
    <p id="homeErr" class="err" role="alert"></p>
  </div>
</main>

<main id="game" class="screen" hidden>
  <header>
    <div class="bar">
      <button id="btnCode" class="code" title="複製邀請連結"></button>
      <div id="phaseLabel" class="phase"></div>
      <div id="clock" class="clock"></div>
      <button id="btnRole" class="snd" title="我的身分" hidden>🎭</button>
      <button id="btnSound" class="snd" title="聲音"></button>
    </div>
    <div class="progress"><i id="progress"></i></div>
    <div id="players" class="players"></div>
  </header>
  <section id="stage" class="stage" hidden aria-live="off">
    <div id="stageFace" class="face"></div>
    <div class="stageInfo">
      <div class="stageTop"><b id="stageName"></b><span id="stageMood"></span></div>
      <div class="meter" title="怒氣值"><i id="angerBar"></i></div>
    </div>
    <div id="angerNum" class="angerNum"></div>
  </section>
  <section id="rules" class="rules" hidden>
    <h2 id="rulesTitle">怎麼玩</h2>
    <ol id="rulesList"></ol>
    <p id="rulesNote"></p>
  </section>
  <section id="log" class="log" aria-live="polite"></section>
  <div id="typing" class="typing" hidden><span id="typingName"></span> 正在輸入<b>.</b><b>.</b><b>.</b></div>
  <div id="floaters" aria-hidden="true"></div>
  <footer id="dock"></footer>
</main>

<div id="roleCard" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="audio.js"></script>
<script src="pixel.js"></script>
<script src="app.js"></script>
</body>
</html>
